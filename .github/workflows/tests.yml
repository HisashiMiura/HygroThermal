# テスト（ロックファイルの版）：push と pull request のたびに、requirements-lock.txt の版で pytest を流す
# 落ちたら、自分のコードの変更が原因。README のバッジはこのテストの結果
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ロックファイルを作った Python の版（requirements-lock.txt の先頭のコメント）
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: ロックファイルの版のパッケージと、このプログラムを入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps

      - name: テストを流す
        run: python -m pytest -q
