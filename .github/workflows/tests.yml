# テスト：push と pull request のたびに、pytest を流す
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml の requires-python（3.11 以上）から、今の版まで
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 依存のパッケージを入れる
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: テストを流す
        run: python -m pytest -q
