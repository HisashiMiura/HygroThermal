<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="13" fill="#2b2a28">
  <!-- 材料の層（左）・広げて描いた境目（中）・通気層（右） -->
  <rect x="40" y="40" width="230" height="150" fill="#f3ece0"/>
  <rect x="270" y="40" width="170" height="150" fill="#e3f1ec"/>
  <rect x="440" y="40" width="280" height="150" fill="#e6eff6"/>
  <g stroke="#2b2a28" stroke-width="2.5">
    <line x1="270" y1="40" x2="270" y2="190"/>
    <line x1="440" y1="40" x2="440" y2="190"/>
  </g>
  <g text-anchor="middle">
    <text x="155" y="30">材料の層</text>
    <text x="355" y="30">境目（広げて描く）</text>
    <text x="580" y="30">通気層</text>
  </g>

  <!-- つながり：材料の中（灰色）、境目の左右（オレンジ）。抵抗の記号（ギザギザ）は幅一定で線の中央 -->
  <path d="M80,110 L155.0,110 L158.3,105 L165.0,115 L171.7,105 L178.3,115 L185.0,105 L191.7,115 L195.0,110 L270,110" fill="none" stroke="#9a9893" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M270,110 L292.5,110 L295.8,105 L302.5,115 L309.2,105 L315.8,115 L322.5,105 L329.2,115 L332.5,110 L355,110" fill="none" stroke="#d9822b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M355,110 L447.5,110 L450.8,105 L457.5,115 L464.2,105 L470.8,115 L477.5,105 L484.2,115 L487.5,110 L580,110" fill="none" stroke="#d9822b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 質点 -->
  <g stroke="#fcfcfb" stroke-width="2">
    <circle cx="80" cy="110" r="6" fill="#2b2a28"/>
    <circle cx="270" cy="110" r="6" fill="#2b2a28"/>
    <path d="M355,102 L363,110 L355,118 L347,110 Z" fill="#1b8a6b"/>
    <circle cx="580" cy="110" r="6" fill="#2f6f9f"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="80" y="136">材料の質点</text>
    <text x="262" y="136" text-anchor="end">材料の表面の質点</text>
    <text x="355" y="160" fill="#1b8a6b">水膜の質点</text>
    <text x="580" y="136">通気層の空気の質点</text>
  </g>

  <!-- コンダクタンスの名前 -->
  <g text-anchor="middle" font-size="12">
    <text x="312" y="96"><tspan font-style="italic">G</tspan><tspan font-size="9" dy="3">m,L</tspan></text>
    <text x="467" y="96"><tspan font-style="italic">G</tspan><tspan font-size="9" dy="3">m,R</tspan></text>
  </g>
  <g text-anchor="middle" font-size="11" fill="#52514e">
    <text x="312" y="62">バックシーラー</text>
    <text x="312" y="76">・塗膜など</text>
    <text x="473" y="76">表面の伝達</text>
  </g>

  <!-- 水膜の水分量（水膜があるとき） -->
  <g stroke="#1b8a6b" stroke-width="1" fill="none">
    <line x1="355" y1="118" x2="355" y2="144" stroke-dasharray="3 2"/>
  </g>
  <text x="355" y="178" text-anchor="middle" font-size="11" fill="#1b8a6b">水膜の水分量 <tspan font-style="italic">W</tspan><tspan font-size="8" dy="3">f</tspan></text>

  <!-- 凡例 -->
  <g font-size="12">
          <path d="M46,222 L56.0,222 L59.3,217 L66.0,227 L72.7,217 L79.3,227 L86.0,217 L92.7,227 L96.0,222 L106,222" fill="none" stroke="#d9822b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="114" y="226">境目の抵抗が入るつながり（水膜の左右）</text>
          <path d="M380,222 L390.0,222 L393.3,217 L400.0,227 L406.7,217 L413.3,227 L420.0,217 L426.7,227 L430.0,222 L440,222" fill="none" stroke="#9a9893" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="448" y="226">層の中のつながり</text>
  </g>
</svg>
