<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="13" fill="#2b2a28">
  <g transform="translate(20,0)">
  <!-- 例：層 0 = 材料（分割数 3）、層 1 = 通気層、層 2 = 材料（分割数 3）。質点は N = 7 個、つながりは 8 本 -->

  <!-- 層の背景（材料は薄い茶、通気層は薄い青） -->
  <rect x="80" y="70" width="240" height="190" fill="#f3ece0"/>
  <rect x="320" y="70" width="160" height="190" fill="#e6eff6"/>
  <rect x="480" y="70" width="240" height="190" fill="#f3ece0"/>

  <!-- 層の名前 -->
  <text x="200" y="58" text-anchor="middle">層 <tspan font-style="italic">l</tspan> = 0（材料）</text>
  <text x="400" y="58" text-anchor="middle">層 <tspan font-style="italic">l</tspan> = 1（通気層）</text>
  <text x="600" y="58" text-anchor="middle">層 <tspan font-style="italic">l</tspan> = 2（材料）</text>

  <!-- 外気・室内 -->
  <text x="40" y="154" text-anchor="middle">外気</text>
  <text x="760" y="154" text-anchor="middle">室内</text>

  <!-- 層の区切り（外表面・境目・内表面） -->
  <g stroke="#2b2a28" stroke-width="2.5">
    <line x1="80" y1="70" x2="80" y2="260"/>
    <line x1="320" y1="70" x2="320" y2="260"/>
    <line x1="480" y1="70" x2="480" y2="260"/>
    <line x1="720" y1="70" x2="720" y2="260"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#52514e">
    <text x="80" y="278">外表面</text>
    <text x="320" y="278">境目</text>
    <text x="480" y="278">境目</text>
    <text x="720" y="278">内表面</text>
  </g>

  <!-- 質点の間隔 Δx_0 -->
  <g stroke="#52514e" stroke-width="1" fill="none">
    <line x1="80" y1="96" x2="200" y2="96"/>
    <path d="M86,92 L80,96 L86,100 M194,92 L200,96 L194,100"/>
  </g>
  <text x="140" y="90" text-anchor="middle" font-size="12">Δ<tspan font-style="italic">x</tspan><tspan font-size="9" dy="3">0</tspan></text>

  <!-- つながり：境目の抵抗が入るものはオレンジ、層の中のものは灰色 -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="48" y1="140" x2="80" y2="140" stroke="#d9822b"/>
    <line x1="80" y1="140" x2="200" y2="140" stroke="#9a9893"/>
    <line x1="200" y1="140" x2="320" y2="140" stroke="#9a9893"/>
    <line x1="320" y1="140" x2="400" y2="140" stroke="#d9822b"/>
    <line x1="400" y1="140" x2="480" y2="140" stroke="#d9822b"/>
    <line x1="480" y1="140" x2="600" y2="140" stroke="#9a9893"/>
    <line x1="600" y1="140" x2="720" y2="140" stroke="#9a9893"/>
    <line x1="720" y1="140" x2="752" y2="140" stroke="#d9822b"/>
  </g>

  <!-- つながりの番号 k -->
  <g text-anchor="middle" font-size="12">
    <text x="64" y="128"><tspan font-style="italic">k</tspan>=0</text>
    <text x="140" y="128"><tspan font-style="italic">k</tspan>=1</text>
    <text x="260" y="128"><tspan font-style="italic">k</tspan>=2</text>
    <text x="360" y="128"><tspan font-style="italic">k</tspan>=3</text>
    <text x="440" y="128"><tspan font-style="italic">k</tspan>=4</text>
    <text x="540" y="128"><tspan font-style="italic">k</tspan>=5</text>
    <text x="660" y="128"><tspan font-style="italic">k</tspan>=6</text>
    <text x="736" y="128"><tspan font-style="italic">k</tspan>=7</text>
  </g>

  <!-- 質点（層の端の質点は区切りの線の上） -->
  <g fill="#2b2a28" stroke="#fcfcfb" stroke-width="2">
    <circle cx="80" cy="140" r="6"/>
    <circle cx="200" cy="140" r="6"/>
    <circle cx="320" cy="140" r="6"/>
    <circle cx="400" cy="140" r="6" fill="#2f6f9f"/>
    <circle cx="480" cy="140" r="6"/>
    <circle cx="600" cy="140" r="6"/>
    <circle cx="720" cy="140" r="6"/>
  </g>

  <!-- 質点の番号 i（区切りの線と重なっても読めるように、後ろに背景の四角を敷く） -->
  <g fill="#fcfcfb">
    <rect x="63" y="154" width="34" height="16" rx="3"/>
    <rect x="183" y="154" width="34" height="16" rx="3"/>
    <rect x="303" y="154" width="34" height="16" rx="3"/>
    <rect x="383" y="154" width="34" height="16" rx="3"/>
    <rect x="463" y="154" width="34" height="16" rx="3"/>
    <rect x="583" y="154" width="34" height="16" rx="3"/>
    <rect x="703" y="154" width="34" height="16" rx="3"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="80" y="166"><tspan font-style="italic">i</tspan>=0</text>
    <text x="200" y="166"><tspan font-style="italic">i</tspan>=1</text>
    <text x="320" y="166"><tspan font-style="italic">i</tspan>=2</text>
    <text x="400" y="166"><tspan font-style="italic">i</tspan>=3</text>
    <text x="480" y="166"><tspan font-style="italic">i</tspan>=4</text>
    <text x="600" y="166"><tspan font-style="italic">i</tspan>=5</text>
    <text x="720" y="166"><tspan font-style="italic">i</tspan>=6</text>
  </g>

  <!-- コントロールボリューム（点線の囲み。層の端の質点は半分の幅、通気層は層の厚さ全体） -->
  <g fill="none" stroke="#52514e" stroke-width="1" stroke-dasharray="4 3">
    <rect x="82" y="182" width="56" height="26"/>
    <rect x="142" y="182" width="116" height="26"/>
    <rect x="262" y="182" width="56" height="26"/>
    <rect x="322" y="182" width="156" height="26"/>
    <rect x="482" y="182" width="56" height="26"/>
    <rect x="542" y="182" width="116" height="26"/>
    <rect x="662" y="182" width="56" height="26"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#52514e">
    <text x="110" y="200"><tspan font-style="italic">w</tspan><tspan font-size="8" dy="3">0</tspan></text>
    <text x="200" y="200"><tspan font-style="italic">w</tspan><tspan font-size="8" dy="3">1</tspan></text>
    <text x="290" y="200"><tspan font-style="italic">w</tspan><tspan font-size="8" dy="3">2</tspan></text>
    <text x="400" y="200"><tspan font-style="italic">w</tspan><tspan font-size="8" dy="3">3</tspan></text>
    <text x="510" y="200"><tspan font-style="italic">w</tspan><tspan font-size="8" dy="3">4</tspan></text>
    <text x="600" y="200"><tspan font-style="italic">w</tspan><tspan font-size="8" dy="3">5</tspan></text>
    <text x="690" y="200"><tspan font-style="italic">w</tspan><tspan font-size="8" dy="3">6</tspan></text>
  </g>

  <!-- 質点 1 の d_L,1 と d_R,1 -->
  <g stroke="#52514e" stroke-width="1" fill="none">
    <line x1="140" y1="232" x2="200" y2="232"/>
    <line x1="200" y1="232" x2="260" y2="232"/>
    <path d="M146,228 L140,232 L146,236 M194,228 L200,232 L194,236 M206,228 L200,232 L206,236 M254,228 L260,232 L254,236"/>
    <line x1="200" y1="214" x2="200" y2="236" stroke-dasharray="2 2"/>
  </g>
  <g text-anchor="middle" font-size="11">
    <text x="170" y="252"><tspan font-style="italic">d</tspan><tspan font-size="8" dy="3">L,1</tspan></text>
    <text x="230" y="252"><tspan font-style="italic">d</tspan><tspan font-size="8" dy="3">R,1</tspan></text>
  </g>

  <!-- 凡例 -->
  <g font-size="12">
    <line x1="90" y1="308" x2="120" y2="308" stroke="#d9822b" stroke-width="3"/>
    <text x="128" y="312">境目の抵抗が入るつながり</text>
    <line x1="320" y1="308" x2="350" y2="308" stroke="#9a9893" stroke-width="3"/>
    <text x="358" y="312">層の中のつながり</text>
    <rect x="510" y="300" width="30" height="16" fill="none" stroke="#52514e" stroke-dasharray="4 3"/>
    <text x="548" y="312">コントロールボリューム</text>
  </g>
  </g>
</svg>
