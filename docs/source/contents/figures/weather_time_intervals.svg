<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="13" fill="#2b2a28">
  <!-- 時刻の位置：h-1=270, h-0.5=385, h=500, h+0.5=615, h+1=730 -->

  <!-- 時刻の補助線 -->
  <g stroke="#e4e3df" stroke-width="1">
    <line x1="270" y1="30" x2="270" y2="222"/>
    <line x1="385" y1="30" x2="385" y2="222"/>
    <line x1="615" y1="30" x2="615" y2="222"/>
    <line x1="730" y1="30" x2="730" y2="222"/>
  </g>
  <!-- h 時の線（「h 時」の欄） -->
  <line x1="500" y1="22" x2="500" y2="222" stroke="#9a9893" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="500" y="16" text-anchor="middle" font-size="12" fill="#52514e">「<tspan font-style="italic">h</tspan> 時」の欄</text>

  <!-- 行の見出し -->
  <g font-size="13">
    <text x="20" y="62">前の 1 時間</text>
    <text x="20" y="80" font-size="11" fill="#52514e">①・④（区間：前）</text>
    <text x="20" y="112">前後 30 分</text>
    <text x="20" y="130" font-size="11" fill="#52514e">③（区間：中央）</text>
    <text x="20" y="162">後の 1 時間</text>
    <text x="20" y="180" font-size="11" fill="#52514e">②・⑤（区間：後）</text>
    <text x="20" y="207"><tspan font-style="italic">h</tspan> 時ちょうど</text>
    <text x="20" y="225" font-size="11" fill="#52514e">⑥（瞬時値）</text>
  </g>

  <!-- 値が表す 1 時間 -->
  <g fill="#cfe0ee" stroke="#2f6f9f" stroke-width="1.5">
    <rect x="270" y="57" width="230" height="20" rx="4"/>
    <rect x="385" y="107" width="230" height="20" rx="4"/>
    <rect x="500" y="157" width="230" height="20" rx="4"/>
  </g>

  <!-- 値が代表する時刻（時間の真ん中） -->
  <g fill="#2f6f9f">
    <path d="M385,72 l-6,-10 h12 z"/>
    <path d="M500,122 l-6,-10 h12 z"/>
    <path d="M615,172 l-6,-10 h12 z"/>
    <circle cx="500" cy="210" r="6"/>
  </g>

  <!-- 時刻の軸 -->
  <line x1="250" y1="240" x2="745" y2="240" stroke="#52514e" stroke-width="1.2"/>
  <g stroke="#52514e" stroke-width="1.2">
    <line x1="270" y1="235" x2="270" y2="245"/>
    <line x1="385" y1="235" x2="385" y2="245"/>
    <line x1="500" y1="235" x2="500" y2="245"/>
    <line x1="615" y1="235" x2="615" y2="245"/>
    <line x1="730" y1="235" x2="730" y2="245"/>
  </g>
  <g text-anchor="middle" font-size="13">
    <text x="270" y="262"><tspan font-style="italic">h</tspan> − 1</text>
    <text x="385" y="262"><tspan font-style="italic">h</tspan> − 0.5</text>
    <text x="500" y="262"><tspan font-style="italic">h</tspan></text>
    <text x="615" y="262"><tspan font-style="italic">h</tspan> + 0.5</text>
    <text x="730" y="262"><tspan font-style="italic">h</tspan> + 1</text>
  </g>
  <text x="232" y="262" text-anchor="end" font-size="12" fill="#52514e">時刻（時）</text>

  <!-- 凡例 -->
  <g font-size="11" fill="#52514e">
    <rect x="270" y="274" width="22" height="10" rx="2" fill="#cfe0ee" stroke="#2f6f9f" stroke-width="1.2"/>
    <text x="298" y="283">値が表す時間</text>
    <path d="M400,284 l-5,-9 h10 z" fill="#2f6f9f"/>
    <text x="410" y="283">値が代表する時刻</text>
    <circle cx="530" cy="279" r="4.5" fill="#2f6f9f"/>
    <text x="540" y="283">瞬時値の時刻</text>
  </g>
</svg>
